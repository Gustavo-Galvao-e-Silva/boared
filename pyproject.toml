[project]
name = "boared"
version = "0.2.0"
description = "Claude Code skills for building verified math study-session materials"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "panchi>=2.0.0",
  "python-pptx>=1.0",
  "matplotlib>=3.5",
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "sympy>=1.12",
  "pillow>=10",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 130
src = ["skills/session-prep/scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "UP007", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
